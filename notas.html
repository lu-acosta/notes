<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>la* — Notas</title><style>
:root{--bg:#141126;--panel:#1d1833;--panel2:#26203f;--ink:#f5f3fa;--muted:#b5accb;--line:#39314f;--lime:#cbfa72;--red:#ffaaaa;--ease:cubic-bezier(.23,1,.32,1);--drawer:cubic-bezier(.32,.72,0,1);color-scheme:dark;font-family:Inter,'Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased;transition:background-color .2s,color .2s}
body.light{--bg:#f5f4f9;--panel:#fff;--panel2:#eeebf5;--ink:#211a36;--muted:#655b77;--line:#ded8e9;--red:#a32b35;color-scheme:light}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:10px 16px;border-radius:10px;transition:transform .1s ease-out,filter .15s}
button:active{transform:scale(.97)}
@media(hover:hover) and (pointer:fine){button:hover{filter:brightness(1.1)}}
button:focus-visible,.row:focus-visible{outline:2px solid #95ba52;outline-offset:3px}
button.primary{background:var(--lime);color:#17132e;border-color:transparent;font-weight:700}
button.small{padding:6px 11px;font-size:13px}
button.danger{color:var(--red)}
.app{display:grid;grid-template-columns:min(370px,38vw) 1fr;height:100dvh}
.pane{overflow:auto;position:relative;min-width:0;overscroll-behavior:contain}
.list{--pane:var(--panel);background:var(--panel);border-right:1px solid var(--line)}
.editor{--pane:var(--bg)}
.glass{position:sticky;top:0;z-index:3;background:color-mix(in srgb,var(--pane) 78%,transparent);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid transparent;transition:border-color .2s}
.glass.edge{border-color:var(--line)}
@media(prefers-reduced-transparency:reduce){.glass{background:var(--pane);backdrop-filter:none;-webkit-backdrop-filter:none}}
.bar{padding:calc(18px + env(safe-area-inset-top)) 18px 12px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.eyebrow{font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
h1{font-size:34px;letter-spacing:-.03em;line-height:1.05;margin:4px 0 0;font-weight:700}
.field{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-width:0}
.field:focus{outline:2px solid #8fac58;outline-offset:1px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:10px;background:var(--panel2);border-radius:12px;padding:4px}
.seg button{border:0;background:none;padding:7px 4px;font-size:13px;color:var(--muted);border-radius:9px}
.seg .on{background:var(--lime);color:#17132e;font-weight:700}
.grp{margin:18px 18px 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.note{margin:12px 18px;font-size:13px}
.item{position:relative;overflow:hidden;margin:0 10px;border-radius:12px}
.act{position:absolute;right:0;top:0;bottom:0;width:88px;border:0;border-radius:0;background:#ff8f8f;color:#17132e;font-weight:700}
.row{position:relative;background:var(--panel);padding:11px 14px;border-radius:12px;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:pointer}
.row::after{content:"";position:absolute;left:14px;right:0;bottom:0;height:1px;background:var(--line)}
.item:last-child .row::after{display:none}
.row b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(min-width:701px){.row.sel{background:var(--lime);color:#17132e}.row.sel .meta{color:#17132ecc}.row.sel::after{display:none}}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:18px;padding:16px 18px calc(24px + env(safe-area-inset-bottom));border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.foot p{flex-basis:100%;margin:0 0 4px}
.ebar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 18px 12px}
.actions{display:flex;gap:8px}
#back{display:none}
.doc{max-width:760px;margin:0 auto;padding:6px clamp(18px,4vw,40px) 80px}
.stamp{text-align:center;font-size:12px;letter-spacing:.02em;color:var(--muted);margin:8px 0 16px}
#t,#b{width:100%;border:0;background:none;outline:0;padding:0}
#t{font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1.15;margin-bottom:10px}
#b{resize:none;font-size:17px;line-height:1.55;min-height:55vh;display:block}
::placeholder{color:var(--muted);opacity:.7}
.blank{display:none;min-height:100dvh;place-items:center;align-content:center;gap:6px;color:var(--muted);text-align:center;padding:30px}
.blank strong{color:var(--ink);font-size:18px}
.mark{font-size:64px;line-height:1;color:var(--lime);animation:rise .6s var(--ease) both}
body.light .mark{color:#446a0a}
.none .blank{display:grid}.none .ebar,.none .doc{display:none}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,160%);opacity:0;visibility:hidden;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);background:var(--lime);color:#17132e;padding:12px 14px 12px 18px;border-radius:14px;box-shadow:0 8px 40px #0004;z-index:20;transition:transform .28s var(--ease),opacity .2s,visibility 0s .28s}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible;transition-delay:0s}
.toast button{background:#17132e;color:#fff;border:0;white-space:nowrap}
@media(max-width:700px){
.app{display:block}.pane{position:absolute;inset:0}
.editor{transform:translateX(100%);visibility:hidden;z-index:5;transition:transform .34s var(--drawer),visibility 0s .34s}
body.editing .editor{transform:none;visibility:visible;transition-delay:0s}
#back{display:inline-block}h1{font-size:32px}}
@media(max-width:700px) and (prefers-reduced-motion:reduce){.editor{transform:none;opacity:0;transition:opacity .2s,visibility 0s .2s}body.editing .editor{opacity:1}}
@media(prefers-reduced-motion:reduce){.mark{animation:none}.toast{transform:translate(-50%,0);transition:opacity .2s,visibility 0s .2s}}
</style></head><body><div class="app">
<section class="pane list" id="lp"><div class="glass bar"><div class="top"><div><div class="eyebrow">ESTUDIO / NOTAS</div><h1>Notas</h1></div><button class="primary" id="new">＋ Nueva</button></div><input class="field" id="q" type="search" placeholder="Buscar" aria-label="Buscar notas"><div class="seg"><button data-f="all">Todas</button><button data-f="pin">Fijadas</button><button data-f="del">Eliminadas</button></div></div>
<div id="items"></div>
<div class="foot"><p>Datos solo en este navegador. Exportá un respaldo para moverlos a otro dispositivo.</p><button class="small" id="exp">Exportar ↓</button><button class="small" id="imp">Importar</button><button class="small" id="theme">Cambiar tema</button></div></section>
<section class="pane editor none" id="ed"><div class="glass ebar"><button class="small" id="back">‹ Notas</button><div class="actions"><button class="small" id="res" hidden>Restaurar</button><button class="small" id="pin">Fijar</button><button class="small" id="copy">Copiar</button><button class="small danger" id="rm">Eliminar</button></div></div>
<div class="doc"><div class="stamp" id="stamp"></div><input id="t" placeholder="Título" maxlength="200" aria-label="Título"><textarea id="b" placeholder="Empezá a escribir…" aria-label="Contenido"></textarea></div>
<div class="blank"><div class="mark">✳</div><strong>Sin nota abierta</strong><span>Elegí una o creá una nueva.</span></div></section>
</div><div id="toast" class="toast" role="status"></div><input id="file" type="file" accept=".json,application/json" hidden>
<script>
'use strict';
const $=s=>document.querySelector(s),KEY='la-notes-v1',DAY=864e5,RM=matchMedia('(prefers-reduced-motion:reduce)'),mob=()=>matchMedia('(max-width:700px)').matches;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const D=new Intl.DateTimeFormat('es-UY',{dateStyle:'long',timeStyle:'short'}),S=new Intl.DateTimeFormat('es-UY'),H=new Intl.DateTimeFormat('es-UY',{hour:'2-digit',minute:'2-digit'});
const sod=()=>{const d=new Date();d.setHours(0,0,0,0);return+d},when=u=>u>=sod()?H.format(u):S.format(u);
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
let bad=false,db=load(),f='all',q='',cur=null,saveT,raf,sw=null,swiped=false,openIt=null;
function clean(r){const now=Date.now();return{theme:r.theme==='light'?'light':'dark',notes:(Array.isArray(r.notes)?r.notes:[]).filter(n=>n&&typeof n.id==='string').map(n=>({id:n.id.slice(0,60),title:String(n.title||'').slice(0,200),body:String(n.body||'').slice(0,2e5),u:+n.u||now,pin:!!n.pin,del:+n.del||0})).filter(n=>!n.del||now-n.del<30*DAY)}}
function load(){let raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}if(raw==null)return{theme:'dark',notes:[]};try{return clean(JSON.parse(raw))}catch(e){bad=true;return{theme:'dark',notes:[]}}}
function commit(){if(bad){toast('No se pudieron leer los datos guardados. Importá un respaldo; el original no se sobrescribió.');return}try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('No se pudo guardar. Exportá un respaldo antes de cerrar.')}}
const save=()=>{clearTimeout(saveT);saveT=setTimeout(commit,250)},get=id=>db.notes.find(n=>n.id===id),apply=()=>document.body.classList.toggle('light',db.theme==='light');
function toast(msg,act,fn){const t=$('#toast');t.innerHTML='<span>'+esc(msg)+'</span>'+(act?'<button class="small">'+act+'</button>':'');if(act)t.querySelector('button').onclick=()=>{fn();hideToast()};t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(hideToast,5000)}
const hideToast=()=>$('#toast').classList.remove('show');
const vis=()=>db.notes.filter(n=>(f==='del'?n.del:!n.del&&(f!=='pin'||n.pin))&&(!q||(n.title+' '+n.body).toLowerCase().includes(q))).sort((a,b)=>b.pin-a.pin||b.u-a.u);
function grp(n){if(f==='del')return'';if(n.pin)return'Fijadas';const s=sod();return n.u>=s?'Hoy':n.u>=s-6*DAY?'Últimos 7 días':'Anteriores'}
function renderList(){const L=vis();let h='',g=null;if(f==='del'&&L.length)h='<p class="muted note">Se borran para siempre a los 30 días. <button class="small danger" id="purge">Vaciar</button></p>';
for(const n of L){const gr=grp(n);if(gr!==g){g=gr;if(gr)h+='<h3 class="grp">'+gr+'</h3>'}h+=`<div class="item" data-id="${esc(n.id)}"><button class="act" tabindex="-1" aria-hidden="true">Eliminar</button><div class="row${n.id===cur?' sel':''}" role="button" tabindex="0"><b>${esc(n.title.trim()||'Nueva nota')}</b><span class="meta">${when(n.u)} · ${esc(n.body.replace(/\s+/g,' ').trim().slice(0,90)||'Sin texto adicional')}</span></div></div>`}
if(!h)h=q?'<div class="empty"><strong>Sin resultados</strong>Probá con otra palabra.</div>':f==='del'?'<div class="empty"><strong>Nada eliminado</strong>Las notas que borres aparecen acá durante 30 días.</div>':f==='pin'?'<div class="empty"><strong>Sin notas fijadas</strong>Fijá una desde el editor.</div>':'<div class="empty"><strong>Sin notas todavía</strong>Creá la primera con “Nueva”.</div>';
$('#items').innerHTML=h}
function setF(x){f=x;document.querySelectorAll('.seg button').forEach(b=>{const on=b.dataset.f===x;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});renderList()}
const stamp=n=>$('#stamp').textContent=(n.del?'Eliminada · ':'')+D.format(n.u),grow=()=>{const b=$('#b');b.style.height='auto';b.style.height=b.scrollHeight+'px'};
function prune(){const n=get(cur);if(n&&!n.del&&!n.title.trim()&&!n.body.trim()){db.notes=db.notes.filter(x=>x!==n);cur=null;save()}}
function show(id,focus){if(id!==cur)prune();cur=id;const n=get(id);if(!n)return;const ro=!!n.del;$('#ed').classList.remove('none');$('#t').value=n.title;$('#b').value=n.body;$('#t').readOnly=$('#b').readOnly=ro;stamp(n);$('#pin').hidden=ro;$('#res').hidden=!ro;$('#pin').textContent=n.pin?'Desfijar':'Fijar';$('#rm').textContent=ro?'Borrar':'Eliminar';document.body.classList.add('editing');grow();renderList();$('#ed').scrollTop=0;if(focus)$('#t').focus()}
function leave(){document.body.classList.remove('editing');prune();renderList();setTimeout(()=>{if(!cur)$('#ed').classList.add('none')},mob()?360:0)}
function trash(id){const n=get(id);if(!n)return;n.del=Date.now();save();if(cur===id){cur=null;leave()}else renderList();toast('Nota eliminada','Deshacer',()=>{n.del=0;save();renderList()})}
function touch(){const n=get(cur);if(!n||n.del)return;n.title=$('#t').value;n.body=$('#b').value;n.u=Date.now();stamp(n);save();cancelAnimationFrame(raf);raf=requestAnimationFrame(renderList)}
$('#t').oninput=touch;$('#b').oninput=()=>{touch();grow()};$('#t').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#b').focus()}};
$('#new').onclick=()=>{if(f==='del')f='all';q='';$('#q').value='';setF(f);const n={id:uid(),title:'',body:'',u:Date.now(),pin:false,del:0};db.notes.unshift(n);save();show(n.id,true)};
$('#back').onclick=leave;$('#q').oninput=e=>{q=e.target.value.trim().toLowerCase();renderList()};document.querySelector('.seg').onclick=e=>{const b=e.target.closest('[data-f]');if(b)setF(b.dataset.f)};
$('#pin').onclick=()=>{const n=get(cur);if(!n)return;n.pin=!n.pin;save();$('#pin').textContent=n.pin?'Desfijar':'Fijar';renderList()};
$('#copy').onclick=async()=>{const n=get(cur);if(!n)return;try{await navigator.clipboard.writeText((n.title?n.title+'\n\n':'')+n.body);toast('Copiada al portapapeles')}catch(e){toast('No se pudo copiar')}};
$('#rm').onclick=()=>{const n=get(cur);if(!n)return;if(!n.del)return trash(cur);if(confirm('¿Borrar esta nota para siempre? No se puede deshacer.')){db.notes=db.notes.filter(x=>x!==n);cur=null;save();leave()}};
$('#res').onclick=()=>{const n=get(cur);if(!n)return;n.del=0;save();cur=null;leave();toast('Nota restaurada')};
/* swipe: 1:1 tracking, velocity projection, critically damped spring handoff */
const setX=it=>{it.querySelector('.row').style.transform=`translateX(${it._x}px)`;it.querySelector('.act').style.width=Math.max(88,-it._x)+'px'};
function spring(it,to,v=0,end){cancelAnimationFrame(it._raf);if(RM.matches){it._x=to;setX(it);end&&end();return}let last=performance.now();const w=2*Math.PI/.38;const step=t=>{const dt=Math.min((t-last)/1000,.032);last=t;v+=(-w*w*(it._x-to)-2*w*v)*dt;it._x+=v*dt;setX(it);if(Math.abs(it._x-to)<.4&&Math.abs(v)<8){it._x=to;setX(it);end&&end()}else it._raf=requestAnimationFrame(step)};it._raf=requestAnimationFrame(step)}
function collapse(it,cb){it.style.height=it.offsetHeight+'px';it.getBoundingClientRect();it.style.transition='height .2s var(--ease)';it.style.height='0';setTimeout(cb,RM.matches?0:200)}
const items=$('#items');
items.addEventListener('pointerdown',e=>{const it=e.target.closest('.item');if(f==='del'||!it||e.button>0||e.target.closest('.act'))return;if(openIt&&openIt!==it){spring(openIt,0);openIt=null}cancelAnimationFrame(it._raf);it._x=it._x||0;sw={it,x0:e.clientX,y0:e.clientY,b:it._x,drag:false,h:[]}});
items.addEventListener('pointermove',e=>{if(!sw)return;const dx=e.clientX-sw.x0,dy=e.clientY-sw.y0,it=sw.it;if(!sw.drag){if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){sw=null;return}if(Math.abs(dx)<10)return;sw.drag=true;sw.x0=e.clientX;it.setPointerCapture(e.pointerId);return}
let x=sw.b+(e.clientX-sw.x0);if(x>0){const W=it.offsetWidth;x=x*W*.55/(W+.55*x)}it._x=x;setX(it);const h=sw.h;h.push({t:e.timeStamp,x});while(h.length>1&&e.timeStamp-h[0].t>100)h.shift()});
const endSw=()=>{if(!sw)return;const{it,drag,h}=sw;sw=null;if(!drag)return;swiped=true;setTimeout(()=>swiped=false,0);const a=h[0],b=h[h.length-1],v=h.length>1&&b.t>a.t?(b.x-a.x)/(b.t-a.t)*1000:0,proj=it._x+v*.099,W=it.offsetWidth;
if(proj<-W*.6)spring(it,-W,v,()=>{const id=it.dataset.id;collapse(it,()=>trash(id))});else if(proj<-44){openIt=it;spring(it,-88,v)}else{if(openIt===it)openIt=null;spring(it,0,v)}};
items.addEventListener('pointerup',endSw);items.addEventListener('pointercancel',endSw);
items.addEventListener('click',e=>{if(e.target.id==='purge'){if(confirm('¿Vaciar las notas eliminadas? No se puede deshacer.')){db.notes=db.notes.filter(n=>!n.del);cur=get(cur)?cur:null;save();if(!cur)leave();renderList()}return}
const it=e.target.closest('.item');if(!it||swiped)return;if(e.target.closest('.act')){const id=it.dataset.id;collapse(it,()=>trash(id));return}if((it._x||0)<-2){openIt=null;spring(it,0);return}show(it.dataset.id)});
items.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('row')){e.preventDefault();show(e.target.parentNode.dataset.id)}});
document.querySelectorAll('.pane').forEach(p=>p.addEventListener('scroll',()=>p.querySelector('.glass').classList.toggle('edge',p.scrollTop>4),{passive:true}));
/* backup + theme */
$('#exp').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='la-notas-respaldo-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('Respaldo exportado')};
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{const fl=e.target.files[0];if(!fl)return;try{if(fl.size>10485760)throw Error('supera 10 MB');const d=clean(JSON.parse(await fl.text()));if(confirm(`Se importarán ${d.notes.length} notas y se reemplazarán las actuales. ¿Continuar?`)){db=d;bad=false;cur=null;commit();apply();$('#ed').classList.add('none');document.body.classList.remove('editing');renderList();toast('Respaldo importado')}}catch(er){toast('No se importó: '+er.message)}e.target.value=''};
$('#theme').onclick=()=>{db.theme=db.theme==='light'?'dark':'light';apply();commit()};
addEventListener('storage',e=>{if(e.key===KEY){db=load();apply();if(cur&&!get(cur)){cur=null;$('#ed').classList.add('none')}renderList()}});
addEventListener('pagehide',()=>{clearTimeout(saveT);commit()});
apply();setF('all');if(!mob()&&vis()[0])show(vis()[0].id);if(bad)toast('No se pudieron leer los datos guardados. Importá un respaldo; el original no se sobrescribió.');
</script></body></html>
